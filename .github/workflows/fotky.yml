name: Ověřit fotky
on:
  push:
    paths: ["index.html", "scripts/fotky.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fotky.mjs
      - name: Uložit fotky.json
        run: |
          git config user.name "fotky-bot"
          git config user.email "fotky-bot@users.noreply.github.com"
          git add fotky.json
          git diff --cached --quiet || git commit -m "Ověřené fotky"
          git push
