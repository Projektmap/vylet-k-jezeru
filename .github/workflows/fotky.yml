name: Ověřit fotky a mapy
on:
  push:
    paths: ["index.html", "scripts/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Znovu nafotit všechny mapy (1 = ano)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: fotky
  cancel-in-progress: false
jobs:
  fotky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ověřit fotky
        run: node scripts/fotky.mjs
      - name: Nafotit mapy
        env:
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/mapy.mjs
      - name: Uložit
        run: |
          git config user.name "fotky-bot"
          git config user.email "fotky-bot@users.noreply.github.com"
          git add fotky.json mapy.json mapy
          git diff --cached --quiet && exit 0
          git commit -m "Ověřené fotky a náhledy map"
          git pull --rebase origin main
          git push
